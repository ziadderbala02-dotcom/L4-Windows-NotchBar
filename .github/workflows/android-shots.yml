name: Android screenshots

# After each Android build: pictures of the notch on an emulator, across camera shapes
# (middle, corner, two holes, wide notch, waterfall, none) and sizes (phone, small phone,
# tablet), so phones we don't have can be checked. Attached to the release as screens_X.Y.Z.zip.
on:
  workflow_run:
    workflows: [Android]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  shots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Get the APK
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: gh release download "android-v$V" -p "NotchLive_$V.apk" -R "$GITHUB_REPOSITORY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash android/tools/shots.sh NotchLive_${{ steps.version.outputs.version }}.apk shots
      - uses: actions/upload-artifact@v4
        with:
          name: screens_${{ steps.version.outputs.version }}
          path: shots
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          zip -qr "screens_$V.zip" shots
          gh release upload "android-v$V" "screens_$V.zip" --clobber -R "$GITHUB_REPOSITORY"
